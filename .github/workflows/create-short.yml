
name: Create Short

on:
  workflow_dispatch:

jobs:
  create-video:
    runs-on: ubuntu-latest

    steps:
      - name: Get project files
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Piper and FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg fonts-dejavu-core
          python -m pip install piper-tts

      - name: Download female voice
        run: |
          mkdir -p voices

          curl -fL --retry 3 \
            -o voices/en_US-lessac-medium.onnx \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx"

          curl -fL --retry 3 \
            -o voices/en_US-lessac-medium.onnx.json \
            "https://huggingface.co/rhasspy/piper-voices/resolve/main/en/en_US/lessac/medium/en_US-lessac-medium.onnx.json"

          ls -lh voices/
          test -s voices/en_US-lessac-medium.onnx
          test -s voices/en_US-lessac-medium.onnx.json

      - name: Create video with female narration
        run: |
          python make_video.py
          echo "Checking finished video audio..."
          ffprobe -v error -show_entries stream=index,codec_type,codec_name -of json output/paws_gone_wild_short.mp4
          echo "Measuring audio levels..."
          ffmpeg -hide_banner -i output/paws_gone_wild_short.mp4 -af volumedetect -vn -f null - 2>&1 | grep -E "mean_volume|max_volume"


      - name: Save finished video
        uses: actions/upload-artifact@v4
        with:
          name: paws-gone-wild-short
          path: output/*.mp4
          if-no-files-found: error

